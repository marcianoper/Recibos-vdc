<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Nómina PDF — Impresión Térmica (OCR)</title>

  <!-- PDF.js -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.js"></script>
  <!-- Tesseract (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root{
      --bg:#0b1220; --card:#0f1b33; --line:rgba(255,255,255,.12);
      --ink:#e9eefc; --muted:rgba(233,238,252,.72);
      --brand:#22c55e; --warn:#f59e0b; --bad:#ef4444;
      --r:18px; --shadow: 0 18px 60px rgba(0,0,0,.45);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:var(--sans); color:var(--ink);
      background:
        radial-gradient(900px 380px at 18% -10%, rgba(34,197,94,.18), transparent 55%),
        radial-gradient(900px 380px at 82% -10%, rgba(245,158,11,.16), transparent 55%),
        linear-gradient(180deg, #070b14, var(--bg));
    }
    header{
      padding:18px 18px 10px; border-bottom:1px solid var(--line);
      position:sticky; top:0; background:rgba(11,18,32,.75);
      backdrop-filter: blur(10px); z-index:5;
    }
    header .row{
      max-width:1240px;margin:0 auto;
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    h1{margin:0;font-size:18px;letter-spacing:.2px}
    .sub{color:var(--muted);font-size:13px;margin-top:4px}
    main{max-width:1240px;margin:0 auto;padding:16px;display:grid;gap:14px}
    .grid{display:grid;grid-template-columns: 480px 1fr;gap:14px}
    @media (max-width: 980px){ .grid{grid-template-columns:1fr} }
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .card .hd{
      padding:14px 14px 10px;
      border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .card .hd b{font-size:14px}
    .card .bd{padding:14px}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input[type="file"], select, input[type="text"], input[type="number"]{
      width:100%; padding:10px 11px;
      border-radius:12px; border:1px solid var(--line);
      background:rgba(255,255,255,.06); color:var(--ink); outline:none;
    }
    input::placeholder{color:rgba(233,238,252,.55)}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .hr{height:1px;background:var(--line);margin:12px 0}
    .btns{display:flex;gap:10px;flex-wrap:wrap}
    button{
      border:1px solid var(--line);
      background:rgba(255,255,255,.08);
      color:var(--ink);
      padding:10px 12px;border-radius:12px;
      cursor:pointer; font-weight:900;
    }
    button.primary{
      background:linear-gradient(180deg, rgba(34,197,94,.95), rgba(16,185,129,.9));
      border-color: rgba(34,197,94,.35); color:#062012;
    }
    button.danger{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.35)}
    button:disabled{opacity:.45;cursor:not-allowed}
    .pill{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
    .hint{font-size:12px;color:var(--muted);line-height:1.35}
    .mono{font-family:var(--mono)}
    .badge{
      display:inline-flex; align-items:center; gap:8px;
      font-size:12px; color:var(--muted);
      border:1px solid var(--line);
      padding:8px 10px; border-radius:12px;
      background:rgba(0,0,0,.18);
    }
    .scroll{
      max-height:620px; overflow:auto;
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.18);
      padding:10px;
    }
    .emp{
      display:flex; justify-content:space-between; gap:10px;
      padding:10px 10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      align-items:flex-start;
    }
    .emp:last-child{border-bottom:none}
    .emp b{font-size:13px}
    .emp .meta{font-size:12px;color:var(--muted);margin-top:2px}
    .emp .amt{font-weight:900}
    .right{text-align:right}
    .log{
      margin-top:10px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:rgba(0,0,0,.22);
      font-family:var(--mono);
      font-size:11px;
      color:rgba(233,238,252,.85);
      white-space:pre-wrap;
      max-height:200px;
      overflow:auto;
      display:none;
    }
    canvas{display:none}
  </style>
</head>

<body>
<header>
  <div class="row">
    <div>
      <h1>Nómina PDF — Impresión Térmica (OCR)</h1>
      <div class="sub">Sube PDF → OCR → detecta empleados → imprime tickets 58/80mm.</div>
    </div>
    <span class="pill" id="statusPill">Sin archivo</span>
  </div>
</header>

<main>
  <div class="grid">
    <section class="card">
      <div class="hd">
        <b>1) Cargar PDF</b>
        <span class="pill mono" id="fileInfo">—</span>
      </div>
      <div class="bd">
        <label>Archivo .pdf</label>
        <input id="file" type="file" accept=".pdf"/>

        <div class="hr"></div>

        <div class="row2">
          <div>
            <label>Idioma OCR</label>
            <select id="lang">
              <option value="spa" selected>Español (spa)</option>
              <option value="eng">Inglés (eng)</option>
            </select>
          </div>
          <div>
            <label>Calidad OCR</label>
            <select id="scale">
              <option value="1.6">Rápido</option>
              <option value="2.0" selected>Normal</option>
              <option value="2.6">Más preciso</option>
            </select>
          </div>
        </div>

        <div class="row2" style="margin-top:10px">
          <div>
            <label>Filtrar por nombre (opcional)</label>
            <input id="filter" type="text" placeholder="Ej. juan, martin..."/>
          </div>
          <div>
            <label>Páginas (opcional)</label>
            <input id="pages" type="text" placeholder="Ej. 1-2 o 1,3,4 (vacío=todo)"/>
          </div>
        </div>

        <div class="hr"></div>

        <b style="font-size:13px">2) Ticket</b>
        <div class="row2" style="margin-top:10px">
          <div>
            <label>Ancho impresora</label>
            <select id="paper">
              <option value="58">58mm</option>
              <option value="80">80mm</option>
            </select>
          </div>
          <div>
            <label>Tamaño letra</label>
            <select id="fontSize">
              <option value="11">Compacto</option>
              <option value="12" selected>Normal</option>
              <option value="13">Grande</option>
            </select>
          </div>
        </div>

        <div class="row2" style="margin-top:10px">
          <div>
            <label>Empresa (opcional)</label>
            <input id="empresa" type="text" placeholder="Carnes y Vísceras del Centro"/>
          </div>
          <div>
            <label>Periodo (opcional)</label>
            <input id="periodo" type="text" placeholder="Semana XX / fechas"/>
          </div>
        </div>

        <div class="row2" style="margin-top:10px">
          <div>
            <label>Mostrar firma</label>
            <select id="firma">
              <option value="1" selected>Sí</option>
              <option value="0">No</option>
            </select>
          </div>
          <div>
            <label>Separación entre notas</label>
            <select id="gap">
              <option value="10" selected>Normal</option>
              <option value="18">Grande</option>
              <option value="0">Sin espacio</option>
            </select>
          </div>
        </div>

        <div class="row2" style="margin-top:10px">
          <div>
            <label>Modo</label>
            <select id="printMode">
              <option value="batch" selected>Lote (una impresión)</option>
              <option value="onebyone">Uno por uno (nota por nota)</option>
            </select>
          </div>
          <div>
            <label>Delay 1×1 (ms)</label>
            <input id="delayMs" type="number" min="200" value="800"/>
          </div>
        </div>

        <div class="hr"></div>

        <div class="btns">
          <button class="primary" id="btnParse" disabled>Leer PDF (OCR)</button>
          <button class="primary" id="btnVista" disabled>Vista previa (1)</button>
          <button class="primary" id="btnImprimir" disabled>Imprimir (según modo)</button>
          <button id="btnImprimir1x1" disabled>Imprimir 1×1</button>
          <button id="btnSiguiente" disabled>Imprimir siguiente</button>
          <button class="danger" id="btnReset" disabled>Limpiar</button>
        </div>

        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <span class="badge" id="countBadge" style="display:none">
            Detectados: <b class="mono" id="countText">0</b>
          </span>
          <span class="badge" id="scanBadge" style="display:none">
            Progreso OCR: <b class="mono" id="scanText">0%</b>
          </span>
          <span class="badge" id="progressBadge" style="display:none">
            Progreso 1×1: <b class="mono" id="progressText">0/0</b>
          </span>
        </div>

        <div class="log" id="logBox"></div>

        <div class="hint" style="margin-top:10px">
          Tip: si el PDF es imagen, OCR tarda. Si puedes, exporta a Excel para que sea instantáneo.
        </div>

        <canvas id="cv"></canvas>
      </div>
    </section>

    <section class="card">
      <div class="hd">
        <b>Empleados detectados</b>
        <span class="pill" id="rowsInfo">0</span>
      </div>
      <div class="bd">
        <div class="scroll" id="list"></div>
      </div>
    </section>
  </div>
</main>

<script>
  // PDF.js config
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.js";

  const $ = s => document.querySelector(s);

  const statusPill = $("#statusPill");
  const fileInfo = $("#fileInfo");
  const rowsInfo = $("#rowsInfo");
  const listDiv = $("#list");
  const logBox = $("#logBox");
  const canvas = $("#cv");
  const ctx = canvas.getContext("2d", { willReadFrequently:true });

  const fileInput = $("#file");
  const filterInp = $("#filter");
  const pagesInp = $("#pages");
  const langSel = $("#lang");
  const scaleSel = $("#scale");

  const btnParse = $("#btnParse");
  const btnVista = $("#btnVista");
  const btnImprimir = $("#btnImprimir");
  const btnImprimir1x1 = $("#btnImprimir1x1");
  const btnSiguiente = $("#btnSiguiente");
  const btnReset = $("#btnReset");

  const paperSel = $("#paper");
  const fontSizeSel = $("#fontSize");
  const empresaInp = $("#empresa");
  const periodoInp = $("#periodo");
  const firmaSel = $("#firma");
  const gapSel = $("#gap");
  const printModeSel = $("#printMode");
  const delayMsInp = $("#delayMs");

  const countBadge = $("#countBadge");
  const countText = $("#countText");
  const scanBadge = $("#scanBadge");
  const scanText = $("#scanText");
  const progressBadge = $("#progressBadge");
  const progressText = $("#progressText");

  let pdfBytes = null;
  let pdfDoc = null;
  let employees = [];
  let printQueue = [];
  let printIndex = 0;
  let printWin = null;

  function setStatus(text, tone="muted"){
    statusPill.textContent = text;
    statusPill.style.color = "rgba(233,238,252,.75)";
    if(tone==="ok") statusPill.style.color = "#86efac";
    if(tone==="warn") statusPill.style.color = "#fcd34d";
    if(tone==="bad") statusPill.style.color = "#fca5a5";
  }

  function showLog(msg){
    logBox.style.display = "block";
    logBox.textContent = String(msg || "");
  }

  function clearLog(){
    logBox.style.display = "none";
    logBox.textContent = "";
  }

  function enableUI(on){
    btnParse.disabled = !on;
    btnVista.disabled = true;
    btnImprimir.disabled = true;
    btnImprimir1x1.disabled = true;
    btnReset.disabled = !on;
    btnSiguiente.disabled = true;
    progressBadge.style.display = "none";
  }

  function safeText(v){
    return String(v ?? "").replace(/\s+/g," ").trim();
  }

  function escapeHtml(s){
    return String(s ?? "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  function parseMoneyFromLine(line){
    // agarra el primer $numero que vea
    // ejemplo: "IMSS  $ 56.20  MENOS"
    const s = line.replace(/,/g,"");
    const m = s.match(/\$?\s*([0-9]+(?:\.[0-9]{1,2})?)/);
    if(!m) return null;
    const n = Number(m[1]);
    return isFinite(n) ? n : null;
  }

  function money(n){
    if(n===null || n===undefined || !isFinite(n)) return "";
    try{ return n.toLocaleString("es-MX",{style:"currency",currency:"MXN"}); }
    catch(e){ return "$"+(Math.round(n*100)/100).toFixed(2); }
  }

  // Etiquetas esperadas
  const LABELS = [
    "SUELDO","EXT","TOTAL","IMSS","ISR","INFONAVIT","A CTA","ACTA","DEPOSITO","DEPÓSITO",
    "FALTA 1 DIA","FALTA 1 DÍA","EXT DIA FEST","EXT DÍA FEST"
  ];

  function normLabel(s){
    const u = safeText(s).toUpperCase();
    if(u==="ACTA") return "A CTA";
    if(u==="DEPÓSITO") return "DEPOSITO";
    if(u==="FALTA 1 DÍA") return "FALTA 1 DIA";
    if(u==="EXT DÍA FEST") return "EXT DIA FEST";
    return u;
  }

  function isLabelLine(line){
    const u = normLabel(line);
    return LABELS.some(l => u.includes(l));
  }

  function looksLikeName(line){
    const s = safeText(line);
    if(!s) return false;
    const u = s.toUpperCase();
    if(LABELS.some(l => u.includes(l))) return false;
    if(u.includes("NÓMINA") || u.includes("NOMINA") || u.includes("SEMANA")) return false;
    if(/^\$/.test(s)) return false;
    // nombres suelen venir en mayúsculas
    const letters = s.replace(/[^A-ZÁÉÍÓÚÑ ]/gi,"").trim();
    if(letters.length < 4) return false;
    // descarta líneas tipo "MENOS"
    if(u==="MENOS") return false;
    return true;
  }

  function parseTextToEmployees(text){
    // Estrategia simple:
    // - detecta una línea "nombre"
    // - luego consume líneas hasta el siguiente nombre
    // - dentro del bloque busca etiquetas + monto
    const lines = text
      .split(/\r?\n/)
      .map(l => safeText(l))
      .filter(Boolean);

    const result = [];
    let cur = null;

    function pushCur(){
      if(!cur) return;
      // neto preferido: DEPOSITO, si no: TOTAL - ded
      const f = cur.fields;
      const total = f["TOTAL"] ?? null;
      const dep = f["DEPOSITO"] ?? null;

      let ded = 0;
      ["IMSS","ISR","INFONAVIT","A CTA","FALTA 1 DIA"].forEach(k=>{
        const v = f[k];
        if(v!=null) ded += Number(v)||0;
      });
      let neto = null;
      if(dep!=null) neto = dep;
      else if(total!=null) neto = total - ded;

      cur.total = total;
      cur.deposito = dep;
      cur.neto = (neto!=null && isFinite(neto)) ? neto : null;

      const has = Object.keys(f).length>0;
      if(has) result.push(cur);
      cur = null;
    }

    for(let i=0;i<lines.length;i++){
      const line = lines[i];
      const u = line.toUpperCase();

      // si parece nombre y cerca hay SUELDO/TOTAL, lo tomamos como inicio
      if(looksLikeName(line)){
        const next1 = (lines[i+1]||"").toUpperCase();
        const next2 = (lines[i+2]||"").toUpperCase();
        const likely = (next1.includes("SUELDO") || next1.includes("EXT") || next1.includes("TOTAL") ||
                        next2.includes("SUELDO") || next2.includes("EXT") || next2.includes("TOTAL"));
        if(likely){
          pushCur();
          cur = { name: line, fields:{} };
          continue;
        }
      }

      if(!cur) continue;

      // Captura de conceptos
      if(isLabelLine(u)){
        const lab = normLabel(u);
        // detecta qué etiqueta es (la primera que haga match)
        const key = LABELS.map(normLabel).find(L => lab.includes(L));
        if(key){
          const amt = parseMoneyFromLine(line);
          if(amt!=null) cur.fields[key] = amt;
        }
      }
    }
    pushCur();

    // limpia duplicados por nombre (a veces OCR repite)
    const uniq = new Map();
    for(const e of result){
      const k = e.name.toUpperCase();
      if(!uniq.has(k)) uniq.set(k, e);
      else{
        // merge (por si uno trae campos faltantes)
        const prev = uniq.get(k);
        Object.assign(prev.fields, e.fields);
        prev.total = prev.fields["TOTAL"] ?? prev.total;
        prev.deposito = prev.fields["DEPOSITO"] ?? prev.deposito;
      }
    }

    return Array.from(uniq.values()).sort((a,b)=>a.name.localeCompare(b.name,"es"));
  }

  function getFilteredEmployees(){
    const q = safeText(filterInp.value).toLowerCase();
    if(!q) return employees.slice();
    return employees.filter(e => e.name.toLowerCase().includes(q));
  }

  function renderList(){
    const arr = getFilteredEmployees();
    rowsInfo.textContent = String(arr.length);

    listDiv.innerHTML = arr.map(e=>{
      const net = e.neto;
      const t = e.total;
      const dep = e.deposito;
      const subtitle = [
        (t!=null ? `Total: ${money(t)}` : null),
        (dep!=null ? `Depósito: ${money(dep)}` : null),
        (net!=null && dep==null ? `Neto calc: ${money(net)}` : null)
      ].filter(Boolean).join(" • ");

      return `
        <div class="emp">
          <div>
            <b>${escapeHtml(e.name)}</b>
            <div class="meta">${escapeHtml(subtitle || "—")}</div>
          </div>
          <div class="right">
            <div class="amt">${escapeHtml(money(dep ?? net ?? t ?? 0))}</div>
            <div class="meta">a pagar</div>
          </div>
        </div>
      `;
    }).join("") || `<div class="hint">No hay empleados con ese filtro.</div>`;
  }

  function getOpts(){
    return {
      paper: paperSel.value,
      fontSize: fontSizeSel.value,
      empresa: empresaInp.value,
      periodo: periodoInp.value,
      firma: firmaSel.value,
      gap: gapSel.value,
    };
  }

  function buildSlipHTML(empList, opts){
    const width = (opts.paper === "80") ? "80mm" : "58mm";
    const fontSize = Number(opts.fontSize || 12);
    const gap = Number(opts.gap || 10);
    const empresa = safeText(opts.empresa);
    const periodo = safeText(opts.periodo);
    const showFirma = (opts.firma === "1");

    function rowLine(label, value, strong=false){
      if(value===null || value===undefined || !isFinite(value)) return "";
      return `
        <tr class="${strong?'total':''}">
          <td>${escapeHtml(label)}</td>
          <td class="right">${strong?`<b>${escapeHtml(money(value))}</b>`:escapeHtml(money(value))}</td>
        </tr>
      `;
    }

    const slips = empList.map(e=>{
      const f = e.fields || {};
      const sueldo = f["SUELDO"] ?? null;
      const ext = f["EXT"] ?? null;
      const extFest = f["EXT DIA FEST"] ?? null;
      const total = f["TOTAL"] ?? null;

      const imss = f["IMSS"] ?? null;
      const isr = f["ISR"] ?? null;
      const inf = f["INFONAVIT"] ?? null;
      const acta = f["A CTA"] ?? null;
      const falta = f["FALTA 1 DIA"] ?? null;

      const deposito = f["DEPOSITO"] ?? null;
      const neto = (deposito!=null ? deposito : (e.neto ?? null));

      return `
        <section class="ticket">
          ${empresa ? `<div class="center bold title">${escapeHtml(empresa)}</div>` : ``}
          <div class="center bold">RECIBO DE SUELDO</div>
          ${periodo ? `<div class="center small muted">${escapeHtml(periodo)}</div>` : ``}
          <div class="hr"></div>

          <div class="row"><span class="lbl">Empleado:</span><span class="val">${escapeHtml(e.name)}</span></div>

          <div class="hr"></div>

          <table>
            <tbody>
              ${rowLine("Sueldo", sueldo)}
              ${rowLine("Extra", ext)}
              ${rowLine("Extra fest", extFest)}
              ${total!=null ? rowLine("Total", total, false) : ""}

              ${(imss!=null || isr!=null || inf!=null || acta!=null || falta!=null) ? `
                <tr><td colspan="2"><div class="sep">Deducciones</div></td></tr>
              ` : ""}

              ${rowLine("IMSS", imss)}
              ${rowLine("ISR", isr)}
              ${rowLine("INFONAVIT", inf)}
              ${rowLine("A CTA", acta)}
              ${rowLine("FALTA 1 DIA", falta)}

              ${neto!=null ? rowLine("Neto / Depósito", neto, true) : ""}
            </tbody>
          </table>

          ${showFirma ? `
            <div class="hr"></div>
            <div class="firma">
              <div class="line"></div>
              <div class="small center muted">Firma empleado</div>
              <div style="height:10px"></div>
              <div class="line"></div>
              <div class="small center muted">Firma responsable</div>
            </div>
          ` : ``}

          <div class="cut"></div>
        </section>
        <div class="gap" style="height:${gap}px"></div>
      `;
    }).join("");

    return `
      <!doctype html>
      <html lang="es">
      <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Impresión Nómina</title>
        <style>
          @page { margin: 0; }
          body{ margin:0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; background:#fff; color:#000; }
          .ticket{ width:${width}; padding: 8px 8px 0; font-size:${fontSize}px; line-height:1.25; }
          .center{text-align:center} .right{text-align:right} .bold{font-weight:900}
          .muted{opacity:.75} .title{font-size:${fontSize+2}px}
          .small{font-size:${Math.max(9, fontSize-2)}px}
          .hr{ border-top:1px dashed #000; margin:8px 0; }
          .row{display:flex; gap:8px;} .lbl{min-width:78px; opacity:.8} .val{flex:1}
          table{width:100%; border-collapse:collapse; margin-top:2px}
          td{padding:2px 0; vertical-align:top}
          tr.total td{padding-top:6px}
          .sep{ margin:8px 0 4px; font-weight:900; border-top:1px dashed #000; padding-top:6px; }
          .firma{margin-top:6px} .line{border-top:1px solid #000; margin:18px 10px 6px}
          .cut{margin-top:10px; border-top: 2px dotted #000;}
          .gap{width:${width}}
          @media print{ body{ -webkit-print-color-adjust: exact; print-color-adjust: exact; } .gap{display:block} }
        </style>
      </head>
      <body>
        ${slips}
        <script>
          setTimeout(()=>{ window.print(); }, 250);
        <\/script>
      </body>
      </html>
    `;
  }

  function openPrint(html){
    const w = window.open("", "_blank");
    if(!w){ alert("Bloqueo de popups: permite popups para imprimir."); return null; }
    w.document.open(); w.document.write(html); w.document.close();
    return w;
  }

  function updateProgress(){
    progressBadge.style.display = "inline-flex";
    progressText.textContent = `${Math.min(printIndex, printQueue.length)}/${printQueue.length}`;
    btnSiguiente.disabled = !(printQueue.length>0 && printIndex < printQueue.length);
  }

  function printOneTicket(emp){
    const html = buildSlipHTML([emp], getOpts());
    if(!printWin || printWin.closed){
      printWin = openPrint(html);
      return;
    }
    try{
      printWin.document.open();
      printWin.document.write(html);
      printWin.document.close();
    }catch(e){
      printWin = openPrint(html);
    }
  }

  async function startPrintOneByOne(list){
    printQueue = list.slice();
    printIndex = 0;
    if(printQueue.length===0) return;

    setStatus("Impresión 1×1 iniciada", "warn");
    printOneTicket(printQueue[printIndex]);
    printIndex++;
    updateProgress();
    btnSiguiente.disabled = false;
  }

  btnSiguiente.addEventListener("click", async ()=>{
    if(printIndex >= printQueue.length){
      setStatus("Impresión 1×1 terminada", "ok");
      btnSiguiente.disabled = true;
      return;
    }
    const delay = Math.max(200, parseInt(delayMsInp.value || "800", 10));
    await new Promise(r=>setTimeout(r, delay));
    printOneTicket(printQueue[printIndex]);
    printIndex++;
    updateProgress();
    if(printIndex >= printQueue.length){
      setStatus("Impresión 1×1 terminada", "ok");
      btnSiguiente.disabled = true;
    }
  });

  function parsePageSpec(spec, numPages){
    const s = safeText(spec);
    if(!s) return [...Array(numPages)].map((_,i)=>i+1);

    const set = new Set();
    const parts = s.split(",").map(x=>x.trim()).filter(Boolean);
    for(const p of parts){
      if(p.includes("-")){
        const [a,b] = p.split("-").map(x=>parseInt(x.trim(),10));
        if(!isFinite(a) || !isFinite(b)) continue;
        const start = Math.max(1, Math.min(a,b));
        const end = Math.min(numPages, Math.max(a,b));
        for(let i=start;i<=end;i++) set.add(i);
      }else{
        const n = parseInt(p,10);
        if(isFinite(n) && n>=1 && n<=numPages) set.add(n);
      }
    }
    const arr = Array.from(set);
    arr.sort((a,b)=>a-b);
    return arr.length ? arr : [...Array(numPages)].map((_,i)=>i+1);
  }

  async function ocrPage(pageNum){
    const page = await pdfDoc.getPage(pageNum);
    const scale = Number(scaleSel.value || 2.0);
    const viewport = page.getViewport({ scale });

    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);

    await page.render({ canvasContext: ctx, viewport }).promise;

    const lang = langSel.value || "spa";
    const { data } = await Tesseract.recognize(canvas, lang, {
      logger: m=>{
        if(m.status === "recognizing text"){
          const pct = Math.round((m.progress||0)*100);
          scanText.textContent = pct + "%";
        }
      }
    });

    return data?.text || "";
  }

  fileInput.addEventListener("change", async (e)=>{
    const f = e.target.files?.[0];
    if(!f){
      setStatus("Sin archivo");
      fileInfo.textContent = "—";
      enableUI(false);
      listDiv.innerHTML = "";
      rowsInfo.textContent = "0";
      countBadge.style.display = "none";
      scanBadge.style.display = "none";
      clearLog();
      return;
    }

    fileInfo.textContent = `${f.name} (${Math.round(f.size/1024)} KB)`;
    setStatus("PDF cargado. Listo para OCR.", "ok");
    clearLog();

    try{
      pdfBytes = await f.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
      enableUI(true);
      btnParse.disabled = false;
    }catch(err){
      console.error(err);
      setStatus("Error abriendo PDF", "bad");
      showLog("ERROR abriendo PDF:\n"+(err?.message||err));
      alert("No se pudo abrir el PDF. Prueba exportarlo otra vez.");
      enableUI(false);
    }
  });

  btnParse.addEventListener("click", async ()=>{
    if(!pdfDoc){
      alert("Primero sube un PDF.");
      return;
    }

    employees = [];
    renderList();
    countBadge.style.display = "none";

    scanBadge.style.display = "inline-flex";
    scanText.textContent = "0%";

    const pages = parsePageSpec(pagesInp.value, pdfDoc.numPages);
    setStatus(`OCR en páginas: ${pages.join(", ")}`, "warn");
    showLog(`OCR iniciando...\nPáginas: ${pages.join(", ")}\n`);

    let bigText = "";

    for(let i=0;i<pages.length;i++){
      const p = pages[i];
      setStatus(`OCR página ${p}/${pdfDoc.numPages}...`, "warn");
      showLog(`OCR página ${p}...\n`);

      try{
        const txt = await ocrPage(p);
        bigText += "\n" + txt + "\n";
      }catch(err){
        console.error(err);
        showLog(`ERROR OCR página ${p}: ${err?.message||err}\n`);
      }
    }

    setStatus("Parseando resultados...", "warn");
    employees = parseTextToEmployees(bigText);

    countBadge.style.display = "inline-flex";
    countText.textContent = String(employees.length);

    renderList();

    const ok = employees.length > 0;
    btnVista.disabled = !ok;
    btnImprimir.disabled = !ok;
    btnImprimir1x1.disabled = !ok;

    setStatus(ok ? "Listo para imprimir" : "No se detectaron empleados (OCR débil)", ok ? "ok" : "warn");
    showLog((logBox.textContent||"") + `\nListo. Detectados: ${employees.length}\n`);
  });

  filterInp.addEventListener("input", ()=> renderList());

  btnReset.addEventListener("click", ()=>{
    pdfBytes = null;
    pdfDoc = null;
    employees = [];
    fileInput.value = "";
    listDiv.innerHTML = "";
    rowsInfo.textContent = "0";
    fileInfo.textContent = "—";
    setStatus("Sin archivo");
    enableUI(false);
    countBadge.style.display = "none";
    scanBadge.style.display = "none";
    clearLog();

    printQueue = [];
    printIndex = 0;
    if(printWin && !printWin.closed) printWin.close();
    printWin = null;

    btnParse.disabled = true;
    btnVista.disabled = true;
    btnImprimir.disabled = true;
    btnImprimir1x1.disabled = true;
  });

  btnVista.addEventListener("click", ()=>{
    const list = getFilteredEmployees();
    if(!list.length){ alert("No hay empleados para el filtro."); return; }
    openPrint(buildSlipHTML([list[0]], getOpts()));
  });

  btnImprimir1x1.addEventListener("click", async ()=>{
    const list = getFilteredEmployees();
    if(!list.length){ alert("No hay empleados para el filtro."); return; }
    await startPrintOneByOne(list);
  });

  btnImprimir.addEventListener("click", async ()=>{
    const list = getFilteredEmployees();
    if(!list.length){ alert("No hay empleados para el filtro."); return; }
    const mode = printModeSel.value;
    if(mode === "batch"){
      openPrint(buildSlipHTML(list, getOpts()));
      return;
    }
    await startPrintOneByOne(list);
  });

  setStatus("Sin archivo");
  enableUI(false);
</script>
</body>
